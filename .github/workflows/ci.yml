name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # Conda initialization and cpv26 activation must run in every step.
        shell: bash -el {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create the dedicated Conda environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: cpv26
          auto-activate: false
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Verify the active Conda Python
        run: |
          test "$CONDA_DEFAULT_ENV" = cpv26
          python -c "import os, sys; from pathlib import Path; assert Path(sys.prefix).resolve() == Path(os.environ['CONDA_PREFIX']).resolve(); assert sys.prefix == sys.base_prefix; print(sys.executable)"

      - name: Validate shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Verify the base installation and CLI entry points
        run: |
          bash scripts/setup.sh base
          cp .env.example .env
          chmod 600 .env
          source scripts/activate.sh
          test ! -e .venv
          cpv26 show-config
          cpv26 db-init
          cpv26 db-check
          cpv26 gpu-check --help
          cpv26 kbo-fetch --help
          cpv26 kbo-import --help
          cpv26 kbo-history-fetch --help
          cpv26 kbo-history-import --help
          cpv26 kbo-graph-build --help
          cpv26 relgnn-train --help
          cpv26 relgnn-ablation-train --help
          cpv26 relgnn-ablation-report --help
          cpv26 relgnn-evaluate --help
          python scripts/profile_relgnn.py --help
          python scripts/show_relgnn_results.py --help
          cpv26 kbo-match-evaluate --help
          cpv26 kbo-live-hit-evaluate --help

      - name: Install CPU PyTorch for neural tests
        run: |
          bash scripts/setup.sh ml-cpu
          source scripts/activate.sh
          test ! -e .venv
          python -c "import torch; print(torch.__version__); assert torch.version.cuda is None"

      - name: Run the validation suite including neural tests
        run: |
          source scripts/activate.sh
          bash scripts/check.sh

      - name: Verify optimization compatibility with PyTorch 2.5.1
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; assert torch.__version__.startswith('2.5.1'); assert torch.version.cuda is None"
          python -m pytest tests/test_relgnn_optimization.py tests/test_relgnn_diagnostics_observer.py tests/test_batch_transfer.py tests/test_optimizer_state.py tests/test_kbo_profile.py tests/test_kbo_runner.py tests/test_kbo_matched_ablation.py
          python -m pip check

      - name: Build wheel
        run: |
          source scripts/activate.sh
          python -m pip wheel . --no-deps -w dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("cpv26_predictor-*.whl"))
          with ZipFile(wheel) as archive:
              for name in (
                  "history_supplement_2015.json", "history_supplement_2018.json",
                  "history_supplement_2021.json", "history_supplement_sources.json",
              ):
                  assert f"cpv26/data/{name}" in archive.namelist(), name
          PY
