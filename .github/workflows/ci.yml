name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # Conda initialization and cpv26 activation must run in every step.
        shell: bash -el {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create the dedicated Conda environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: cpv26
          auto-activate: false
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Verify the active Conda Python
        run: |
          test "$CONDA_DEFAULT_ENV" = cpv26
          python -c "import os, sys; from pathlib import Path; assert Path(sys.prefix).resolve() == Path(os.environ['CONDA_PREFIX']).resolve(); assert sys.prefix == sys.base_prefix; print(sys.executable)"

      - name: Validate shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Verify the base installation and CLI entry points
        run: |
          bash scripts/setup.sh base
          cp .env.example .env
          chmod 600 .env
          source scripts/activate.sh
          test ! -e .venv
          cpv26 show-config
          cpv26 db-init
          cpv26 db-check
          cpv26 gpu-check --help
          cpv26 kbo-fetch --help
          cpv26 kbo-import --help
          cpv26 kbo-graph-build --help
          cpv26 relgnn-train --help
          cpv26 relgnn-evaluate --help
          cpv26 kbo-match-evaluate --help
          cpv26 kbo-live-hit-evaluate --help

      - name: Install CPU PyTorch for neural tests
        run: |
          bash scripts/setup.sh ml-cpu
          source scripts/activate.sh
          test ! -e .venv
          python -c "import torch; print(torch.__version__); assert torch.version.cuda is None"

      - name: Run the validation suite including neural tests
        run: |
          source scripts/activate.sh
          bash scripts/check.sh

      - name: Build wheel
        run: |
          source scripts/activate.sh
          python -m pip wheel . --no-deps -w dist
