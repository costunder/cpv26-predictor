[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "cpv26-predictor"
version = "0.4.0"
description = "Point-in-time relational baseball prediction and V26 decision optimization"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "cpv26-predictor contributors" }]
dependencies = [
  "duckdb>=1.1,<2",
  "numpy>=1.26,<2.3",
  "pytz>=2024.2",
  "rich>=13.8,<15",
  "tzdata>=2024.2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
tabular = [
  "catboost>=1.2,<2",
]
neural = [
  "torch>=2.4,<3",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
cpv26 = "cpv26.cli:app"

[project.urls]
Repository = "https://github.com/costunder/cpv26-predictor"
Issues = "https://github.com/costunder/cpv26-predictor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cpv26"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src/cpv26"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true
